<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@300;600&display=block" rel="stylesheet">
<style>
  :root { --gold: #D4AF37; --soft: #f1e5ac; --ivory: #F4F1E8; --mist: #A9BEC4; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: linear-gradient(160deg, #0a4b5d 0%, #04303f 58%, #011E2E 100%); font-family: Montserrat, sans-serif; position: relative; }
  .scales { position: absolute; inset: 0; background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l30 30-30 30L0 30z' fill='none' stroke='%23D4AF37' stroke-opacity='0.07' stroke-width='1'/%3E%3C/svg%3E"); }
  .frame { position: absolute; inset: 28px; border: 1px solid rgba(212,175,55,.35); }
  .frame::before { content: ''; position: absolute; inset: 8px; border: 1px solid rgba(212,175,55,.15); }
  .corner { position: absolute; width: 56px; height: 56px; border-color: var(--gold); border-style: solid; border-width: 0; }
  .tl { top: 28px; left: 28px; border-top-width: 2px; border-left-width: 2px; } .tr { top: 28px; right: 28px; border-top-width: 2px; border-right-width: 2px; }
  .bl { bottom: 28px; left: 28px; border-bottom-width: 2px; border-left-width: 2px; } .br { bottom: 28px; right: 28px; border-bottom-width: 2px; border-right-width: 2px; }
  .fan { position: absolute; right: 70px; bottom: 36px; width: 460px; height: 520px; }
  .content { position: absolute; left: 96px; top: 96px; width: 640px; display: flex; flex-direction: column; gap: 26px; }
  .brand { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 34px; letter-spacing: 12px; color: var(--gold); }
  .eyebrow { display: flex; align-items: center; gap: 16px; font-size: 15px; font-weight: 600; letter-spacing: 6px; text-transform: uppercase; color: var(--gold); }
  .eyebrow span { display: block; width: 52px; height: 1px; background: var(--gold); }
  h1 { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 62px; line-height: 1.05; color: var(--ivory); }
  h1 em { display: block; font-weight: 400; color: var(--gold); }
  .foot { font-size: 20px; font-weight: 300; color: var(--mist); letter-spacing: .5px; }
  .foot b { font-weight: 600; color: var(--soft); }
</style></head><body>
<div class="scales"></div>
<svg class="fan" viewBox="0 0 520 546" preserveAspectRatio="xMidYMax meet">
  <defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#D4AF37" stop-opacity=".6"/><stop offset="1" stop-color="#D4AF37" stop-opacity=".05"/></linearGradient></defs>
  <g stroke="url(#g)" stroke-width="1.6" fill="none"><path d="M260 546V150M260 546L120 196M260 546L400 196M260 546L30 268M260 546L490 268M260 546L-20 372M260 546L540 372"/></g>
  <g fill="none" stroke="#D4AF37" stroke-opacity=".5"><path d="M110 546a150 150 0 01300 0M150 546a110 110 0 01220 0M190 546a70 70 0 01140 0"/></g>
  <circle cx="260" cy="128" r="6" fill="#D4AF37" fill-opacity=".9"/>
</svg>
<div class="frame"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="content">
  <div class="brand">KHUANANY</div>
  <div class="eyebrow"><span></span>Diseño web · Puebla, México</div>
  <h1>Sitios web con acabado profesional<em>para negocios que quieren destacar</em></h1>
  <div class="foot">Planes para todo México · <b>khuanany.com</b></div>
</div>
</body></html>
